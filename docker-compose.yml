services:
  backend:
    build:
      context: .
      dockerfile: Dockerfile
    environment:
      KEYCLOAK_SERVER_URL: ${KEYCLOAK_SERVER_URL}
      KEYCLOAK_INTERNAL_URL: ${KEYCLOAK_INTERNAL_URL}
      KEYCLOAK_REALM: ${KEYCLOAK_REALM}
      KEYCLOAK_CLIENT_ID: ${KEYCLOAK_CLIENT_ID}
      KEYCLOAK_CLIENT_SECRET: ${KEYCLOAK_CLIENT_SECRET}
      POSTGRES_URL: ${POSTGRES_URL:-jdbc:postgresql://app-postgres:5432/nosql_lab1}
      POSTGRES_USER: ${POSTGRES_USER:-nosql_lab1}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-nosql_lab1}
    depends_on:
      - keycloak
      - app-postgres
    ports:
      - "${PORT_BACKEND:-8080}:8080"

  keycloak:
    container_name: keycloak
    image: quay.io/keycloak/keycloak:26.0.7
    ports:
      - "${PORT_KEYCLOAK:-8081}:8080"
    environment:
      KC_HOSTNAME: ${KEYCLOAK_SERVER_URL}
      KC_DB: postgres
      KC_DB_URL: jdbc:postgresql://keycloak-postgres:5432/keycloak
      KC_DB_USERNAME: keycloak
      KC_DB_PASSWORD: ${KC_DB_PASSWORD}
      KC_BOOTSTRAP_ADMIN_USERNAME: ${KEYCLOAK_ADMIN}
      KC_BOOTSTRAP_ADMIN_PASSWORD: ${KEYCLOAK_PASSWORD}
    depends_on:
      - keycloak-postgres
    command: start-dev --http-port=8080 --hostname-strict=false --http-enabled=true

  keycloak-postgres:
    image: postgres:13
    environment:
      POSTGRES_DB: keycloak
      POSTGRES_USER: keycloak
      POSTGRES_PASSWORD: ${KC_DB_PASSWORD}
    ports:
      - "${PORT_KC_DB:-5433}:5432"
    volumes:
      - keycloak_postgres_data:/var/lib/postgresql/data

  app-postgres:
    image: postgres:16
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-nosql_lab1}
      POSTGRES_USER: ${POSTGRES_USER:-nosql_lab1}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-nosql_lab1}
    ports:
      - "${PORT_APP_DB:-5432}:5432"
    volumes:
      - app_postgres_data:/var/lib/postgresql/data

volumes:
  keycloak_postgres_data:
  app_postgres_data:
